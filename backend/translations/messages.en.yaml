app:
    application:
        createUser:
            validationFailed: User creation validation failed.
        updateUser:
            userNotFoundException: User {{ id }} not found.
            validationFailed: User update validation failed.
        deleteUser:
            userNotFoundException: User {{ id }} not found.
        listUsers:
            invalidUserIdException: User IDs must be a list of integers.
            invalidForwardPaginationException:
                firstIds: Argument ($firstIds) should be a positive.
                afterId: Argument ($afterId) should be greater than or equal to 0.
                limit: Argument ($limit) should be greater than or equal to 1.
            invalidSortingException:
                direction: 'Argument ($direction) for {{ field }} must be: ASC or DESC.'
                field: 'Argument ($field) must be: ID, CREATED_AT or UPDATED_AT.'
                both: 'Argument ($sorts) must be an array with keys: field and direction.'
        login:
            badCredentials: Bad credentials. Try again.
        rotateRefreshToken:
            notFoundMessage: Token not found.
            expiredMessage: Token is expired.
            revokedMessage: Token is revoked.
            replacedMessage: Token is replaced.
        updateEmail:
            validationFailed: New email validation failed.
        updatePassword:
            validationFailed: New password validation failed.
        updateUsername:
            validationFailed: New username validation failed. 
        updateProfile:
            validationFailed: Update profile validation failed.
    domain:
        authorization:
            refreshToken:
                tokenHash:
                    notBlankMessage: The token hash must not be blank.
                    maxMessage: The token hash is too long. It should have {{ limit }} characters or less.
                    uniqueEntityMessage: This token hash {{ value }} is already used.
        user:
            username:
                notBlankMessage: Your username should not be blank.
                maxMessage: Your username is too long. It should have {{ limit }} characters or less.
                uniqueEntityMessage: This username {{ value }} is already used.
            roles:
                notBlankMessage: Your roles should not be blank.
                notArrayMessage: The roles must be an array.
                oneMessage: You must specify one role only.
                notUniqueMessage: The roles must be unique.
                choiceMessage: Role must be either ROLE_USER or ROLE_ADMIN.
            password:
                notBlankMessage: Your password should not be blank.
                maxMessage: Your password is too long. It should have {{ limit }} characters or less.
            salutation:
                maxMessage: Your salutation title is too long. It should have {{ limit }} characters or less.
            pronouns:
                maxMessage: Your pronouns are too long. They should have {{ limit }} characters or less.
            genderIdentity:
                maxMessage: Your gender identity is too long. It should have {{ limit }} characters or less.
            firstName:
                notBlankMessage: Your first name should not be blank.
                maxMessage: Your first name is too long. It should have {{ limit }} characters or less.
            middleName:
                maxMessage: Your middle name is too long. It should have {{ limit }} characters or less.
            lastName:
                notBlankMessage: Your last name should not be blank.
                maxMessage: Your last name is too long. It should have {{ limit }} characters or less.
            email:
                notBlankMessage: Your email address should not be blank.
                maxMessage: Your email address is too long. It should have {{ limit }} characters or less.
                emailMessage: Your email address {{ value }} is not a valid email.
                uniqueEntityMessage: This email address {{ value }} is already used.
            phoneNumber:
                maxMessage: Your phone number is too long. It should have {{ limit }} characters or less.
    graphql:
        authorization:
            forbiddenException: You do not have permission to perform this action.
            unauthenticatedException: Authentication is required.
        execution:
            executor:
                executorException: Error occurred when executing the GraphQL query.
        request:
            requestParser:
                badRequestGraphQLException: '{{ object }} must be an object.'
        resolver:
            account:
                unauthenticatedException: Authentication is required.
            authentication:
                unauthenticatedException: Authentication is required.
    infrastructure:
        authentication:
            accessToken:
                expired: Expired credentials.
                invalid: Invalid credentials.
                invalidAudience: Invalid credentials. Invalid audience.
                invalidIssuer: Invalid credentials. Invalid issuer.
                missingSubject: Invalid credentials. Missing username.
