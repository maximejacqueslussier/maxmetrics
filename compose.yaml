x-backend-environment: &backend-environment
  APP_ENV: prod
  APP_SECRET_FILE: /run/secrets/app_secret
  DEFAULT_URI: https://${BACKEND_SERVER_NAME:-api.maxmetrics.ca}
  FRONTEND_ORIGIN: https://${FRONTEND_SERVER_NAME:-www.maxmetrics.ca}
  JWT_SECRET_FILE: /run/secrets/jwt_secret
  JWT_AUDIENCE: ${FRONTEND_SERVER_NAME:-www.maxmetrics.ca}
  POSTGRES_DB: ${POSTGRES_DB:-maxmetrics}
  POSTGRES_HOST: database
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-maxmetrics}
  POSTGRES_VERSION: ${POSTGRES_VERSION:-18}

x-service-defaults: &service-defaults
  init: true
  logging:
    driver: local
    options:
      max-file: "3"
      max-size: 10m
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *service-defaults
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      BACKEND_SERVER_NAME: ${BACKEND_SERVER_NAME:-api.maxmetrics.ca}
      BACKEND_UPSTREAM: backend:8080
      CADDY_GLOBAL_OPTIONS: email ${ACME_EMAIL:-admin@maxmetrics.ca}
      FRONTEND_HEALTH_URL: http://frontend/healthz
      FRONTEND_SERVER_NAME: ${FRONTEND_SERVER_NAME:-www.maxmetrics.ca}
      FRONTEND_UPSTREAM: frontend:80
      TLS_DIRECTIVE: ""
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- "$$FRONTEND_HEALTH_URL" >/dev/null
          && wget -qO- http://backend:8080/healthz >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

  frontend:
    <<: *service-defaults
    image: maxmetrics-frontend:prod
    build:
      context: ./frontend
      target: prod
      args:
        VITE_MAXMETRICS_API_URL: https://${BACKEND_SERVER_NAME:-api.maxmetrics.ca}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app

  backend:
    <<: *service-defaults
    image: maxmetrics-backend:prod
    build:
      context: ./backend
      target: frankenphp_prod
    restart: unless-stopped
    environment: *backend-environment
    secrets:
      - app_secret
      - jwt_secret
      - postgres_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          . /usr/local/bin/load-secrets
          && php -r '$$context = stream_context_create(["http" => ["method" => "OPTIONS"]]);
          exit(false === @file_get_contents("http://127.0.0.1:8080/graphql", false, $$context) ? 1 : 0);'
          && php bin/console dbal:run-sql -q "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app
      - data

  migrate:
    <<: *service-defaults
    image: maxmetrics-backend:prod
    environment: *backend-environment
    secrets:
      - app_secret
      - jwt_secret
      - postgres_password
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--all-or-nothing"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    networks:
      - data

  database:
    <<: *service-defaults
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maxmetrics}
      POSTGRES_USER: ${POSTGRES_USER:-maxmetrics}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maxmetrics} -d ${POSTGRES_DB:-maxmetrics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - database_data:/var/lib/postgresql
    networks:
      - data

networks:
  app:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  database_data:

secrets:
  app_secret:
    environment: APP_SECRET
  jwt_secret:
    environment: JWT_SECRET
  postgres_password:
    environment: POSTGRES_PASSWORD
